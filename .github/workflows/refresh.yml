name: Daily weETH refresh

on:
  schedule:
    - cron: "20 7 * * *"   # 07:20 UTC — just after the AUM dashboard refresh
  workflow_dispatch: {}    # manual "run now" trigger

permissions:
  contents: write          # to commit refreshed snapshots

concurrency:
  group: weeth-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh snapshot
        # No secrets: positions and history come from public Ethereum RPC nodes,
        # pricing from the public CoinGecko API. The step exits non-zero if every
        # RPC endpoint is unreachable, leaving the last good snapshot published.
        run: python weeth_refresh.py

      - name: Commit refreshed snapshot
        run: |
          git config user.name  "kpk-weeth-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/weeth_events.json data/weeth_latest.json weeth-data.js weeth-etherfi-dashboard.html
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "chore: daily weETH refresh ($(date -u +%Y-%m-%d))"
            git push
          fi
