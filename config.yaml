# kpk — weETH (ether.fi) allocation dashboard configuration.
#
# Everything here is PUBLIC data: the managed DAO wallets are public onchain
# addresses and the token is a public contract. This project uses NO secrets —
# positions and history come from public Ethereum RPC nodes and pricing from the
# public CoinGecko API, so there is nothing to keep out of this file.

firm:
  name: "kpk"

# Managed wallet registry. Mirrors clients[] in the kpk AUM dashboard. Every
# refresh reads weETH balances and Transfer logs for exactly these addresses,
# so adding one here is all it takes to bring a DAO onto the page.
clients:
  - name: "CoW DAO"
    addresses:
      - { address: "0x616de58c011f8736fa20c7ae5352f7f6fb9f0669", chains: [ethereum, gnosis] }
      - { address: "0x7f8987d6a8bee31bd7be80e877732579e2582a28", chains: [gnosis] }
      - { address: "0x9009B4411D0e1171cc042b77D7701f46B737Fdb9", chains: [gnosis] }
  - name: "Balancer DAO"
    addresses:
      - { address: "0x0efccbb9e2c09ea29551879bd9da32362b32fc89", chains: [ethereum, arbitrum, gnosis] }
  - name: "ENS"
    addresses:
      - { address: "0x4f2083f5fbede34c2714affb3105539775f7fe64", chains: [ethereum] }
  - name: "Nexus Mutual"
    addresses:
      - { address: "0x8e53d04644e9ab0412a8c6bd228c84da7664cfe3", chains: [ethereum] }
  # Nexus Mutual's Capital Pool — a protocol contract, not a treasury Safe, so it
  # is reported as its own entity rather than folded into the Nexus Mutual line.
  # `color` overrides the monochrome ramp for this entity only; the remaining
  # entities still take the ramp in size order, so darkest = largest holder.
  - name: "Nexus Capital pool"
    color: "#10B981"
    addresses:
      - { address: "0x27f23c710dd3d878fe9393d93465fed1302f2ebd", chains: [ethereum] }

etherfi:
  enabled: true
  token:
    symbol: weETH
    address: "0xCd5fE23C85820F7B72D0926FC9b05b43E359b7ee"
    chain: ethereum
    decimals: 18
    coingecko: wrapped-eeth
  reference_coingecko: weth        # ETH-equivalent reference price
  events_cache: "data/weeth_events.json"

# Public Ethereum RPC endpoints — no key, no account, no rate-limit tier.
# Tried in order; whichever answers first is promoted for the rest of the run,
# so one node being down or throttling never fails a refresh.
#
# ORDERING MATTERS. The list is led by endpoints that serve historical
# `eth_getLogs` for free, because that is the one call the free tiers restrict.
# Verified 2026-09-09; the previous list had rotted in every position:
#   drpc.org        400 "can't route your request to suitable provider"
#   publicnode.com  403 "archive requests require a personal token"
#   rpc.ankr.com    now requires an API key
#   cloudflare-eth  eth_getLogs capped at 800 blocks
#   eth.llamarpc    525, gone
# The tail entries below cannot serve archive logs but answer eth_call and
# eth_blockNumber fine, so they remain useful fallbacks for the balance reads
# that determine the headline figure.
rpc:
  endpoints:
    - "https://gateway.tenderly.co/public/mainnet"     # logs: 100k+ block range
    - "https://eth.api.onfinality.io/public"           # logs: 100k+ block range
    - "https://rpc.mevblocker.io"                      # logs: ~9k block range
    - "https://ethereum-rpc.publicnode.com"            # balances only
    - "https://eth.merkle.io"                          # balances only
    - "https://eth.drpc.org"                           # balances only
  log_chunk_blocks: 9000       # smallest window the log-capable endpoints all accept
