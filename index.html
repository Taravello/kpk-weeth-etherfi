<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KPK · weETH allocated to ether.fi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap');
  /* KPK brand palette (Ecru-dominant), Lexend, monochrome — identical tokens to
     the AUM dashboard so the two pages read as one system. */
  :root {
    --bg:        #EFEEEA;
    --surface:   #FFFFFF;
    --surface-2: #E7E6E2;
    --raised:    #DCDBD4;
    --hairline:  #DBDAD3;
    --hairline-2:#E5E4DE;
    --text:      #1C1C1A;
    --muted:     #55544E;
    --muted-2:   #706F66;
    --deployed:  #1F1F1F;
    --deployed-bg:#E8E7E5;
    --deployed-dim:#C6C5BE;
    --idle:      #B4B3AC;
    --eth:       #6C6B67;
    --eur:       #97968F;
    --warn:      #6C6B67;
    --logo-text: "KPK";
    --font-label: "Lexend", ui-sans-serif, "Inter", system-ui, "Helvetica Neue", Arial, sans-serif;
    --font-mono:  "Lexend", ui-sans-serif, "Inter", system-ui, sans-serif;
    --maxw: 1160px;
    --r-lg: 14px; --r-md: 10px; --r-sm: 7px;
    --shadow: 0 1px 2px rgba(31,31,31,.05), 0 10px 28px -18px rgba(31,31,31,.20);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font-label);
    font-feature-settings: "tnum" 1, "lnum" 1, "cv05" 1;
    line-height: 1.5; letter-spacing: .1px; -webkit-font-smoothing: antialiased;
  }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums lining-nums; }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 30px 26px 100px; }

  /* ---- top bar ---- */
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px;
            padding-bottom:20px; border-bottom:1px solid var(--hairline); }
  .brand { display:flex; align-items:center; gap:11px; }
  .logo-mark { display:inline-flex; }
  .logo-mark svg { height:28px; width:28px; display:block; }
  .brand .logo { font-family:var(--font-label); font-weight:700; font-size:26px; letter-spacing:2px; color:var(--text); }
  .brand .logo::before { content: var(--logo-text); }
  .brand .sub { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:2.5px; }
  .meta { text-align:right; color:var(--muted); font-size:12px; }
  .meta .num { color:var(--text); }
  .badge { display:inline-block; margin-left:8px; padding:2px 8px; border:1px solid var(--warn);
           color:var(--warn); border-radius:999px; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; }

  /* ---- hero ---- */
  .hero { padding:46px 0 6px; }
  .hero .eyebrow { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:3px; }
  .hero .total { font-family:var(--font-mono); font-size:clamp(42px,8vw,88px); font-weight:600;
                 line-height:1.0; margin:14px 0 4px; letter-spacing:-2px; }
  .hero .total .unit { color:var(--muted-2); font-size:.30em; vertical-align:middle; margin-left:14px; letter-spacing:0; }
  .hero .accent-rule { width:56px; height:3px; background:var(--deployed); margin:18px 0 24px; border-radius:2px; }
  .hero .restate { color:var(--muted); font-size:13.5px; max-width:660px; }
  .hero .restate .num { color:var(--text); }

  /* per-DAO split bar under the headline */
  .alloc { max-width:680px; margin-top:26px; }
  .alloc .splitbar { display:flex; height:12px; border-radius:999px; overflow:hidden; background:var(--raised); }
  .alloc .seg { height:100%; }
  .alloc .legend { display:flex; flex-wrap:wrap; gap:10px 28px; margin-top:14px; }
  .alloc .leg { display:flex; align-items:baseline; gap:9px; font-size:13px; }
  .alloc .leg .sw { width:9px; height:9px; border-radius:50%; align-self:center; }
  .alloc .leg .lab { color:var(--muted); }
  .alloc .leg .val { font-family:var(--font-mono); color:var(--text); }
  .alloc .leg .pc { color:var(--muted-2); font-family:var(--font-mono); font-size:12px; }

  /* ---- KPI band ---- */
  .kpis { display:grid; grid-template-columns:repeat(6,1fr); gap:1px; margin-top:34px;
          background:var(--hairline); border:1px solid var(--hairline); border-radius:var(--r-lg);
          overflow:hidden; box-shadow:var(--shadow); }
  .kpi { position:relative; background:var(--surface); padding:20px 20px 18px; min-width:0;
         transition:background .15s ease; }
  .kpi:hover { background:#FDFDFC; }
  .kpi::before { content:""; position:absolute; top:0; left:20px; right:20px; height:2px;
                 background:var(--raised); border-radius:0 0 2px 2px; }
  .kpi .k { color:var(--muted); font-size:9.5px; text-transform:uppercase; letter-spacing:1.7px;
            font-weight:600; line-height:1.4; }
  .kpi .v { font-family:var(--font-mono); font-size:clamp(20px, 1.8vw, 26px); font-weight:600;
            margin-top:9px; letter-spacing:-.5px; line-height:1.05; white-space:nowrap; }
  .kpi .sub { color:var(--muted-2); font-size:10.5px; margin-top:6px; line-height:1.45; }
  @media (max-width:1080px){ .kpis{ grid-template-columns:repeat(3,1fr);} }
  @media (max-width:640px){ .kpis{ grid-template-columns:repeat(2,1fr);} .kpi{ padding:16px 16px 14px; } }

  /* ---- sections ---- */
  .section { margin-top:54px; }
  .section > h2 { font-size:12px; text-transform:uppercase; letter-spacing:2.5px; color:var(--muted);
                  font-weight:600; margin:0 0 18px; padding-bottom:12px; border-bottom:1px solid var(--hairline); }

  .card { background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r-lg);
          padding:22px 24px; box-shadow:var(--shadow); }
  .card-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px;
               margin-bottom:16px; flex-wrap:wrap; }
  .card-head .t { font-size:14px; font-weight:650; }
  .card-head .c { color:var(--muted); font-size:11.5px; }

  /* ---- growth chart ---- */
  .chart { width:100%; height:auto; display:block; }
  .chart .axis { stroke:var(--hairline); } .chart .grid { stroke:var(--hairline-2); }
  .chart .vlabel { font-family:var(--font-mono); font-size:10px; fill:var(--muted); }
  .chart .xlabel { font-size:10px; fill:var(--muted); }
  .chart .band { transition:opacity .12s ease; }
  .chart .totline { fill:none; stroke:var(--text); stroke-width:1.6; stroke-linejoin:round; }
  .chart .evt { fill:var(--surface); stroke:var(--text); stroke-width:1.4; }
  .chart .cursor { stroke:var(--muted-2); stroke-width:1; stroke-dasharray:3 3; }
  .clegend { display:flex; flex-wrap:wrap; gap:10px 24px; margin-top:14px; font-size:12px; color:var(--muted); }
  .clegend span { display:flex; align-items:center; gap:8px; }
  .clegend i { width:11px; height:11px; border-radius:3px; }
  .clegend b { font-family:var(--font-mono); font-weight:500; color:var(--text); }

  /* ---- per-DAO rows ---- */
  .daos { display:flex; flex-direction:column; gap:14px; }
  .dao { background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r-lg);
         padding:22px 24px; box-shadow:var(--shadow); }
  .dao .dh { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
  .dao .nm { display:flex; align-items:center; gap:10px; font-size:17px; font-weight:650; letter-spacing:-.2px; }
  .dao .nm .sw { width:10px; height:10px; border-radius:3px; flex:0 0 auto; }
  .dao .addr { color:var(--muted); font-size:11.5px; margin-top:5px; font-family:var(--font-mono); }
  .dao .addr a { color:var(--muted); text-decoration:none; border-bottom:1px dotted var(--deployed-dim); }
  .dao .addr a:hover { color:var(--text); }
  .dao .tot { font-family:var(--font-mono); font-size:23px; text-align:right; letter-spacing:-.5px; white-space:nowrap; }
  .dao .tot .u { color:var(--muted-2); font-size:.52em; margin-left:6px; }
  .dao .share { color:var(--muted); font-size:11.5px; text-align:right; font-family:var(--font-mono); margin-top:3px; }
  .dao .tbar { display:flex; height:7px; border-radius:999px; overflow:hidden; background:var(--raised); margin:18px 0 12px; }
  .dao .mini { display:flex; gap:26px; flex-wrap:wrap; }
  .dao .mini .m .k { color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:1px; display:block; }
  .dao .mini .m .v { font-family:var(--font-mono); font-size:13px; margin-top:3px; }

  /* ---- events table ---- */
  table.evts { width:100%; border-collapse:collapse; font-size:13px; }
  table.evts th { text-align:left; color:var(--muted); font-size:10px; text-transform:uppercase;
                  letter-spacing:1.5px; font-weight:600; padding:0 12px 11px 0; border-bottom:1px solid var(--hairline); }
  table.evts td { padding:11px 12px 11px 0; border-bottom:1px solid var(--hairline-2); }
  table.evts tr:last-child td { border-bottom:none; }
  table.evts tbody tr:hover { background:var(--surface-2); }
  table.evts .r { text-align:right; font-family:var(--font-mono); }
  table.evts .day { font-family:var(--font-mono); color:var(--muted); white-space:nowrap; }
  table.evts .who { display:flex; align-items:center; gap:9px; }
  table.evts .who .sw { width:9px; height:9px; border-radius:3px; flex:0 0 auto; }
  .dir { display:inline-block; padding:2px 9px; border-radius:999px; font-size:10px;
         letter-spacing:1.2px; text-transform:uppercase; font-weight:600; }
  .dir.in  { background:var(--deployed-bg); color:var(--deployed); border:1px solid var(--deployed-dim); }
  .dir.out { background:var(--surface-2); color:var(--muted); border:1px solid var(--hairline); }

  /* ---- tooltip ---- */
  .tt { position:fixed; z-index:9999; pointer-events:none; background:var(--text); color:#fff;
        font-family:var(--font-mono); font-size:11.5px; line-height:1.45; padding:8px 11px; border-radius:6px;
        box-shadow:0 6px 20px rgba(20,21,23,.22); white-space:nowrap; opacity:.97; }
  .tt .h { font-weight:600; margin-bottom:4px; }
  .tt .r { display:flex; justify-content:space-between; gap:18px; opacity:.86; }
  .tt .r.tot { opacity:1; margin-top:4px; padding-top:4px; border-top:1px solid rgba(255,255,255,.25); }

  /* ---- footnote ---- */
  .foot { margin-top:56px; padding-top:20px; border-top:1px solid var(--hairline);
          color:var(--muted); font-size:11.5px; max-width:840px; }
  .foot strong { color:var(--text); font-weight:600; }
  .foot p { margin:0 0 9px; }
  .foot code { font-family:var(--font-mono); color:var(--text); background:var(--surface-2);
               padding:1px 5px; border-radius:4px; font-size:11px; }
  :focus-visible { outline:2px solid var(--deployed); outline-offset:2px; border-radius:3px; }

  @media (max-width:760px) {
    .dao .dh { flex-direction:column; } .dao .tot, .dao .share { text-align:left; }
    table.evts .hide-sm { display:none; }
  }
  @media print {
    @page { margin: 13mm; }
    * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
    body { background:#fff; }
    .wrap { max-width:none; padding:0 0 8px; }
    .section { margin-top:26px; }
    .section, .card, .dao, .kpis { break-inside:avoid; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="weeth-data.js"></script>
<script>
(function () {
  "use strict";

  var D = window.__WEETH_DATA__;
  var app = document.getElementById("app");
  if (!D) {
    app.innerHTML = '<p style="padding:40px 0;color:#55544E">No snapshot found. ' +
                    'Run <code>python weeth_refresh.py</code> to build weeth-data.js.</p>';
    return;
  }

  /* Monochrome brand ramp, darkest = largest holder. Mirrors the AUM page's
     "direction and weight carried by tone, never by hue" rule.
     An entity may carry an explicit brand colour (config.yaml -> clients[].color);
     the ramp is then dealt out across the remaining entities in size order, so
     darkest still reads as largest within the monochrome set. */
  var RAMP = ["#1F1F1F", "#6C6B67", "#97968F", "#B4B3AC", "#C6C5BE", "#DCDBD4"];
  var ORDER = D.daos.map(function (d) { return d.name; });
  var COLOR = {}, ramped = 0;
  D.daos.forEach(function (d) {
    COLOR[d.name] = d.color || RAMP[Math.min(ramped++, RAMP.length - 1)];
  });

  // ---- formatting -------------------------------------------------------
  function esc(s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function fmt(n, dp) {
    if (n === null || n === undefined || isNaN(n)) return "—";
    return Number(n).toLocaleString("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp });
  }
  function usdCompact(n) {
    var a = Math.abs(n);
    if (a >= 1e9) return "$" + fmt(n / 1e9, 2) + "B";
    if (a >= 1e6) return "$" + fmt(n / 1e6, 2) + "M";
    if (a >= 1e3) return "$" + fmt(n / 1e3, 1) + "k";
    return "$" + fmt(n, 0);
  }
  function day(iso) {
    var p = String(iso).split("-");
    return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
  }
  function dateLabel(iso) {
    var d = day(iso);
    return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric", timeZone: "UTC" });
  }
  function monthLabel(iso) {
    return day(iso).toLocaleDateString("en-GB", { month: "short", year: "numeric", timeZone: "UTC" });
  }
  function shortAddr(a) { return a ? a.slice(0, 6) + "…" + a.slice(-4) : "—"; }

  // ---- tooltip ----------------------------------------------------------
  var tip = null;
  function showTip(html, ev) {
    if (!tip) { tip = document.createElement("div"); tip.className = "tt"; document.body.appendChild(tip); }
    tip.innerHTML = html;
    var pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
    var x = Math.min(ev.clientX + pad, window.innerWidth - w - 8);
    var y = ev.clientY - h - pad;
    if (y < 8) y = ev.clientY + pad;
    tip.style.left = x + "px"; tip.style.top = y + "px"; tip.style.display = "block";
  }
  function hideTip() { if (tip) tip.style.display = "none"; }

  var T = D.totals, P = D.prices, V = D.verification || {};

  // ---- top bar + hero ---------------------------------------------------
  var badge = D.mode === "live" ? "" : '<span class="badge">' + esc(D.mode) + "</span>";
  var html = "";

  html += '<div class="topbar"><div class="brand">' +
          '<span class="logo-mark"><svg viewBox="0 0 120 120" role="img" aria-label="KPK">' +
          '<g fill="var(--text)" stroke="var(--text)" stroke-width="11" stroke-linejoin="round">' +
          '<polygon points="22,22 52,22 22,52"/><polygon points="22,98 52,98 22,68"/>' +
          '<polygon points="104,22 104,98 56,60"/></g></svg></span>' +
          '<span class="logo"></span>' +
          '<span class="sub">weETH allocated to ether.fi · On behalf of clients</span></div>' +
          '<div class="meta">Updated <span class="num">' + esc(D.updated_at) + "</span>" + badge +
          '<br/>Token <span class="num">' + esc(D.token.symbol) + " · " + esc(D.token.chain) + "</span></div></div>";

  html += '<section class="hero">' +
          '<div class="eyebrow">Cumulative weETH allocated to ether.fi by managed DAOs</div>' +
          '<div class="total"><span class="num">' + fmt(T.weeth, 2) + '</span>' +
          '<span class="unit">weETH</span></div>' +
          '<div class="accent-rule"></div>' +
          '<div class="restate">Worth <span class="num">' + usdCompact(T.usd) + '</span> at ' +
          '<span class="num">$' + fmt(P.weeth_usd, 2) + '</span>/weETH, and redeemable for about ' +
          '<span class="num">' + fmt(T.eth_equivalent, 0) + '</span> ETH — weETH accrues ether.fi staking ' +
          'yield in its redemption rate, currently <span class="num">' + fmt(P.weeth_eth_ratio, 4) +
          '</span> ETH per weETH.</div>';

  // split bar by DAO
  var segs = "", legs = "";
  D.daos.forEach(function (d) {
    if (d.weeth <= 0) return;
    segs += '<div class="seg" style="width:' + d.share_pct + '%;background:' + COLOR[d.name] + '"></div>';
    legs += '<div class="leg"><span class="sw" style="background:' + COLOR[d.name] + '"></span>' +
            '<span class="lab">' + esc(d.name) + '</span>' +
            '<span class="val">' + fmt(d.weeth, 1) + '</span>' +
            '<span class="pc">' + fmt(d.share_pct, 1) + '%</span></div>';
  });
  html += '<div class="alloc"><div class="splitbar">' + segs + "</div>" +
          '<div class="legend">' + legs + "</div></div></section>";

  // ---- KPI band ---------------------------------------------------------
  function kpi(k, v, sub) {
    return '<div class="kpi"><div class="k">' + k + '</div><div class="v num">' + v + "</div>" +
           (sub ? '<div class="sub">' + sub + "</div>" : "") + "</div>";
  }
  html += '<div class="kpis">' +
          kpi("Cumulative weETH", fmt(T.weeth, 2), "net of redemptions and transfers out") +
          kpi("Current value", usdCompact(T.usd), "$" + fmt(P.weeth_usd, 2) + " per weETH") +
          kpi("ETH equivalent", fmt(T.eth_equivalent, 0), fmt(P.weeth_eth_ratio, 4) + " ETH per weETH") +
          kpi("DAOs allocated", T.daos_allocated + " of " + T.daos_managed, "across " + T.wallets + " managed wallets") +
          kpi("Allocation events", T.events, T.transfers + " onchain transfers") +
          kpi("First allocation", monthLabel(T.first_allocation),
              "latest activity " + dateLabel(T.last_allocation)) +
          "</div>";

  // ---- growth chart -----------------------------------------------------
  html += '<section class="section"><h2>How the position was built</h2><div class="card">' +
          '<div class="card-head"><div class="t">Cumulative weETH held, by DAO</div>' +
          '<div class="c">Step changes mark allocation events. Hover for the position on any date.</div></div>' +
          '<div id="chart"></div><div class="clegend" id="clegend"></div></div></section>';

  // ---- per-DAO ----------------------------------------------------------
  html += '<section class="section"><h2>Allocation by DAO</h2><div class="daos">';
  D.daos.forEach(function (d) {
    var explorer = "https://etherscan.io/token/" + D.token.address + "?a=" + d.wallet;
    html += '<div class="dao"><div class="dh"><div>' +
            '<div class="nm"><span class="sw" style="background:' + COLOR[d.name] + '"></span>' + esc(d.name) + "</div>" +
            '<div class="addr"><a href="' + esc(explorer) + '" target="_blank" rel="noopener">' +
            esc(shortAddr(d.wallet)) + "</a></div></div>" +
            '<div><div class="tot"><span class="num">' + fmt(d.weeth, 2) + '</span><span class="u">weETH</span></div>' +
            '<div class="share">' + usdCompact(d.usd) + " · " + fmt(d.share_pct, 1) + "% of total</div></div></div>" +
            '<div class="tbar"><div style="width:' + d.share_pct + '%;background:' + COLOR[d.name] + '"></div></div>' +
            '<div class="mini">' +
            '<div class="m"><span class="k">ETH equivalent</span><span class="v num">' + fmt(d.eth_equivalent, 1) + "</span></div>" +
            '<div class="m"><span class="k">Gross allocated</span><span class="v num">' + fmt(d.gross_in, 2) + "</span></div>" +
            '<div class="m"><span class="k">Withdrawn</span><span class="v num">' + fmt(d.gross_out, 2) + "</span></div>" +
            '<div class="m"><span class="k">First allocation</span><span class="v num">' + dateLabel(d.first) + "</span></div>" +
            '<div class="m"><span class="k">Latest activity</span><span class="v num">' + dateLabel(d.last) + "</span></div>" +
            "</div></div>";
  });
  html += "</div></section>";

  // ---- events table -----------------------------------------------------
  html += '<section class="section"><h2>Allocation events</h2><div class="card">' +
          '<table class="evts"><thead><tr><th>Date</th><th>DAO</th><th></th>' +
          '<th class="r">weETH</th><th class="r hide-sm">DAO position</th>' +
          '<th class="r">Cumulative total</th></tr></thead><tbody>';
  D.events.forEach(function (e) {
    var inflow = e.delta >= 0;
    html += "<tr><td class='day'>" + dateLabel(e.day) + "</td>" +
            '<td><span class="who"><span class="sw" style="background:' + COLOR[e.dao] + '"></span>' + esc(e.dao) + "</span></td>" +
            '<td><span class="dir ' + (inflow ? "in" : "out") + '">' + (inflow ? "Allocated" : "Withdrawn") + "</span></td>" +
            '<td class="r">' + (inflow ? "+" : "−") + fmt(Math.abs(e.delta), 2) + "</td>" +
            '<td class="r hide-sm">' + fmt(e.dao_total, 2) + "</td>" +
            '<td class="r"><strong>' + fmt(e.total, 2) + "</strong></td></tr>";
  });
  html += "</tbody></table></div></section>";

  // ---- footnote ---------------------------------------------------------
  html += '<div class="foot">' +
    "<p><strong>What this measures.</strong> The cumulative weETH position held by the DAOs under kpk " +
    "management, built from every ERC-20 transfer of weETH touching a managed wallet. It is a " +
    "<strong>position, not a flow</strong>: gross allocations (" + fmt(T.gross_in, 2) + " weETH) minus " +
    "withdrawals (" + fmt(T.gross_out, 2) + " weETH), which by construction equals the current onchain balance.</p>" +
    "<p><strong>Token.</strong> ether.fi weETH <code>" + esc(D.token.address) + "</code> on " + esc(D.token.chain) +
    ". weETH is the non-rebasing wrapper of eETH: the balance is constant and staking yield accrues in the " +
    "redemption rate, so the ETH equivalent above rises even when the weETH count does not.</p>" +
    "<p><strong>Wallets.</strong> The " + T.wallets + " managed addresses in the kpk client roster " +
    "(<code>config.yaml → clients[]</code>). Adding a client or an address there feeds this page " +
    "automatically.</p>" +
    "<p><strong>Sources.</strong> Balances and transfer history are read straight from Ethereum public " +
    "RPC nodes (<code>balanceOf</code> and <code>Transfer</code> logs), priced with " + esc(P.source) +
    " as of " + esc(P.as_of || D.updated_at) + ". No API key is involved anywhere, so every figure here " +
    "is independently verifiable by anyone against the same public endpoints.</p>" +
    (V.wallets_checked
      ? "<p><strong>Self-check.</strong> Every refresh replays the full transfer history and compares it " +
        "against the live onchain balance of each managed wallet. Last run: " +
        (V.matched ? "matched all " + V.wallets_checked + " wallets exactly"
                   : "drift of " + fmt(V.max_drift_weeth, 6) + " weETH detected and reconciled") +
        ".</p>"
      : "") +
    "</div>";

  app.innerHTML = html;

  // ---- chart rendering --------------------------------------------------
  drawChart();

  function drawChart() {
    var S = D.series;
    if (!S || S.length < 2) { document.getElementById("chart").innerHTML = ""; return; }

    var W = 1000, H = 380, m = { t: 16, r: 18, b: 38, l: 72 };
    var pw = W - m.l - m.r, ph = H - m.t - m.b;

    var t0 = day(S[0].day).getTime(), t1 = day(S[S.length - 1].day).getTime();
    var span = Math.max(t1 - t0, 1);
    var maxTotal = 0;
    S.forEach(function (p) { maxTotal = Math.max(maxTotal, p.total); });
    var yMax = niceMax(maxTotal * 1.06);

    function X(ms) { return m.l + ((ms - t0) / span) * pw; }
    function Y(v) { return m.t + ph - (v / yMax) * ph; }

    var xs = S.map(function (p) { return X(day(p.day).getTime()); });

    // stacked step bands, largest DAO at the base
    var bands = "", lower = S.map(function () { return 0; });
    ORDER.forEach(function (name) {
      var upper = S.map(function (p, i) { return lower[i] + (p.by_dao[name] || 0); });
      bands += '<path class="band" fill="' + COLOR[name] + '" fill-opacity=".92" d="' +
               areaPath(xs, upper, lower, Y) + '"></path>';
      lower = upper;
    });

    var totals = S.map(function (p) { return p.total; });
    var line = '<path class="totline" d="' + linePath(xs, totals, Y) + '"></path>';

    // gridlines + value labels
    var grid = "";
    for (var g = 0; g <= 4; g++) {
      var v = (yMax / 4) * g, y = Y(v);
      grid += '<line class="grid" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y + '" y2="' + y + '"></line>' +
              '<text class="vlabel" x="' + (m.l - 10) + '" y="' + (y + 3.5) + '" text-anchor="end">' + fmt(v, 0) + "</text>";
    }
    grid += '<line class="axis" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + Y(0) + '" y2="' + Y(0) + '"></line>';

    // month ticks
    var ticks = "", cur = new Date(Date.UTC(day(S[0].day).getUTCFullYear(), day(S[0].day).getUTCMonth(), 1));
    var stepMonths = Math.max(1, Math.ceil((span / 2.628e9) / 8));   // ~8 labels max
    while (cur.getTime() <= t1) {
      if (cur.getTime() >= t0) {
        ticks += '<text class="xlabel" x="' + X(cur.getTime()) + '" y="' + (H - 14) + '" text-anchor="middle">' +
                 cur.toLocaleDateString("en-GB", { month: "short", year: "2-digit", timeZone: "UTC" }) + "</text>";
      }
      cur = new Date(Date.UTC(cur.getUTCFullYear(), cur.getUTCMonth() + stepMonths, 1));
    }

    // event markers (skip the synthetic leading zero and trailing "today" point)
    var marks = "";
    S.forEach(function (p, i) {
      if (i === 0 || p.total === (S[i - 1] || {}).total) return;
      marks += '<circle class="evt" cx="' + xs[i] + '" cy="' + Y(p.total) + '" r="3.4"></circle>';
    });

    var svg = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" ' +
              'aria-label="Cumulative weETH allocated to ether.fi by DAO over time">' +
              grid + bands + line + marks + ticks +
              '<line class="cursor" id="cursor" y1="' + m.t + '" y2="' + (m.t + ph) + '" style="display:none"></line>' +
              '<rect id="hit" x="' + m.l + '" y="' + m.t + '" width="' + pw + '" height="' + ph +
              '" fill="transparent" style="cursor:crosshair"></rect></svg>';

    document.getElementById("chart").innerHTML = svg;

    var leg = "";
    D.daos.forEach(function (d) {
      leg += '<span><i style="background:' + COLOR[d.name] + '"></i>' + esc(d.name) +
             " <b>" + fmt(d.weeth, 2) + "</b></span>";
    });
    document.getElementById("clegend").innerHTML = leg;

    // hover: nearest step point at or before the cursor date
    var hit = document.getElementById("hit"), cursor = document.getElementById("cursor"), svgEl = hit.ownerSVGElement;
    hit.addEventListener("mousemove", function (ev) {
      var box = svgEl.getBoundingClientRect();
      var px = ((ev.clientX - box.left) / box.width) * W;
      var ms = t0 + ((px - m.l) / pw) * span;
      var k = 0;
      for (var i = 0; i < S.length; i++) { if (day(S[i].day).getTime() <= ms) k = i; }
      var p = S[k];
      cursor.setAttribute("x1", xs[k]); cursor.setAttribute("x2", xs[k]);
      cursor.style.display = "";
      var rows = "";
      ORDER.forEach(function (n) {
        var v = p.by_dao[n] || 0;
        if (v <= 0) return;
        rows += '<div class="r"><span>' + esc(n) + "</span><span>" + fmt(v, 2) + "</span></div>";
      });
      showTip('<div class="h">' + dateLabel(p.day) + "</div>" + rows +
              '<div class="r tot"><span>Total</span><span>' + fmt(p.total, 2) + " weETH</span></div>", ev);
    });
    hit.addEventListener("mouseleave", function () { hideTip(); cursor.style.display = "none"; });
  }

  function areaPath(xs, upper, lower, Y) {
    var d = "M" + xs[0] + " " + Y(upper[0]);
    for (var i = 0; i < xs.length; i++) {
      d += " L" + xs[i] + " " + Y(upper[i]);
      if (i < xs.length - 1) d += " L" + xs[i + 1] + " " + Y(upper[i]);   // step-after
    }
    for (var j = xs.length - 1; j >= 0; j--) {
      if (j < xs.length - 1) d += " L" + xs[j + 1] + " " + Y(lower[j]);
      d += " L" + xs[j] + " " + Y(lower[j]);
    }
    return d + " Z";
  }

  function linePath(xs, vals, Y) {
    var d = "M" + xs[0] + " " + Y(vals[0]);
    for (var i = 0; i < xs.length; i++) {
      d += " L" + xs[i] + " " + Y(vals[i]);
      if (i < xs.length - 1) d += " L" + xs[i + 1] + " " + Y(vals[i]);
    }
    return d;
  }

  function niceMax(v) {
    if (v <= 0) return 1;
    var exp = Math.pow(10, Math.floor(Math.log10(v)));
    var steps = [1, 1.25, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
    for (var i = 0; i < steps.length; i++) { if (steps[i] * exp >= v) return steps[i] * exp; }
    return 10 * exp;
  }
})();
</script>
</body>
